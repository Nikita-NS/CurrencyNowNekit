services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fxbot
      POSTGRES_PASSWORD: fxbot
      POSTGRES_DB: fxbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxbot -d fxbot"]
      interval: 5s
      timeout: 5s
      retries: 12

  bot:
    build: .
    env_file:
      - .env
    environment:
      # внутри compose база доступна по имени сервиса
      DATABASE_URL: postgresql://fxbot:fxbot@db:5432/fxbot
      TZ_NAME: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  pgdata:
